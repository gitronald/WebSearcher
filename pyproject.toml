[project]
name = "WebSearcher"
version = "0.12.0"
description = "Tools for conducting, collecting, and parsing web search"
authors = [{name = "Ronald E. Robertson", email = "rer@acm.org"}]
keywords = ["web", "search", "parser"]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.0",
    "selectolax>=1.0.0",
    "tldextract>=5.1.2",
    "brotli>=1.1.0",
    "pydantic>=2.9.2",
    "patchright>=1.60.1",
    "protobuf>=6.33.5,<8.0.0",
    "orjson>=3.11.5,<4.0.0",
]

[project.urls]
homepage = "https://github.com/gitronald/WebSearcher"
repository = "https://github.com/gitronald/WebSearcher"

[project.scripts]
ws-demo = 'WebSearcher.demos:main'

# Which proj-template release this repo was scaffolded from, stamped by
# proj-init.sh and re-stamped by the install-template skill on upgrade. Inert to
# consumers: build backends translate only [project], so this never reaches the
# wheel or the PyPI metadata. Read it to audit template drift across repos.
[tool.proj-template]
version = "0.11.2"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "syrupy>=4.8.1",
    "typer>=0.15.2",
    "pyarrow>=23.0.0",
    "polars>=1.37.1",
    "pre-commit>=4.5.1",
    "pyrefly>=1.0.0",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml, so the
    # commit hook and `uv run ruff` (CI, the Stop hook) apply one rule set.
    # Bump the two together.
    "ruff>=0.17,<0.18",
    "pytest-cov>=7.0.0",
    # bs4 + lxml are dev-only: used by show_serp.py's overlay stripping (the
    # serp-inspect skill). Runtime parsing is selectolax-only.
    "beautifulsoup4>=4.12.3",
    "lxml>=6.1.0",
]

[tool.pyrefly]
preset = "strict"
python-version = "3.12"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", ".worktrees/**", ".claude/**", "data/**"]
# patchright is a runtime dep but ships no type stubs, so fall back to Any on its
# lazy imports instead of erroring.
ignore-missing-imports = [
    "patchright",
    "patchright.sync_api",
]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["WebSearcher"]
branch = true
omit = ["WebSearcher/searchers/*_searcher.py", "WebSearcher/parsers/bench.py"]  # bench is a dev tool, run from a checkout

[tool.coverage.report]
show_missing = true
skip_empty = true
# Current branch-coverage total at the 0.11.2 template upgrade; raise as tests grow.
fail_under = 79
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff 0.16 formats Python fences inside Markdown; keep it off prose (READMEs,
# changelogs, plans). Drop this line to have fenced code formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]
ignore = ["E501"]  # line length handled by ruff format

[tool.ruff.lint.isort]
known-first-party = ["WebSearcher"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Allowlist what the sdist ships. The wheel already contains only the
# WebSearcher/ package; this trims the sdist to match (~24MB -> a few hundred KB).
# Root-anchored (leading "/") so bare names don't glob at every depth. Anything
# not listed here (docs, plans, tests, CI config, dev dotfiles) stays in the repo
# but is kept out of the distributed source archive. hatchling force-includes
# pyproject.toml, PKG-INFO, and .gitignore regardless, so treat those as
# sdist-visible.
only-include = [
    "/WebSearcher",  # the importable package (includes the demos at WebSearcher/demos/)
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
